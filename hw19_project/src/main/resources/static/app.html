<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <title>Бронирование</title>
    <style>
        .box { max-width: 820px; margin: 40px auto; font-family: sans-serif; }
        input { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
        button { padding: 10px 12px; margin-top: 10px; cursor: pointer; }
        .err { color: #b00020; }
        .ok { color: #0a7; }
        .muted { color: #666; font-size: 13px; }
        .card { border: 1px solid #ddd; border-radius: 10px; padding: 14px; margin-top: 14px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .listItem { border: 1px solid #eee; border-radius: 10px; padding: 10px; margin: 8px 0; }
        .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid #ddd; }
        .btnSmall { padding: 6px 10px; margin-top: 0; }
        .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
        .danger { border: 1px solid #ffb3b3; }
    </style>
</head>
<body>
<div class="box">
    <div class="topbar">
        <div>
            <h1 style="margin:0;">Бронирование</h1>
            <div id="who" class="muted"></div>
        </div>
        <button id="logoutBtn" type="button">Выйти</button>
    </div>

    <div class="card">
        <h3 style="margin-top:0;">Создать бронь</h3>

        <div class="muted" style="margin-bottom:10px;">
            Заведение работает с <b>12:00</b> до <b>24:00</b>.<br/>
            Бронь оформляется на <b>3 часа</b>, поэтому последнее доступное время начала — <b>21:00</b>.<br/>
            Максимальное количество гостей за один стол — <b>8</b>.
        </div>

        <form id="resForm">
            <label class="muted">Имя</label>
            <input id="guestName" placeholder="Например, Анна" required minlength="2" maxlength="50"/>

            <label class="muted">Телефон</label>
            <input id="guestPhone" placeholder="+7..." required minlength="5" maxlength="64"/>

            <label class="muted">Количество персон</label>
            <input id="persons" type="number" min="1" max="8" step="1" required/>

            <label class="muted">Дата и время начала</label>
            <input id="startTime" type="datetime-local" required/>

            <button type="submit">Забронировать (3 часа)</button>
        </form>

        <p id="msg" style="margin-bottom:0;"></p>
    </div>

    <div class="card">
        <div class="topbar">
            <h3 style="margin:0;">Мои брони</h3>
            <button id="refreshBtn" type="button">Обновить</button>
        </div>
        <div id="list" class="muted" style="margin-top:10px;"></div>
    </div>
</div>

<script>
    async function apiFetch(url, options = {}) {
        return fetch(url, { credentials: "same-origin", ...options });
    }

    async function getProfileOrNull() {
        const res = await apiFetch("/api/auth/profile");
        if (res.status === 200) return res.json();
        return null;
    }

    async function logoutRequest() {
        return apiFetch("/logout", { method: "POST" });
    }

    async function createReservation(payload) {
        return apiFetch("/api/reservation", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
    }

    async function loadMyReservations() {
        return apiFetch("/api/reservation", { method: "GET" });
    }

    async function cancelReservation(reservationId) {
        return apiFetch(`/api/reservation/${reservationId}/cancel`, { method: "POST" });
    }

    function escapeHtml(s) {
        return String(s ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function statusLabel(status) {
        if (status === "CONFIRMED") return "CONFIRMED ✅";
        if (status === "CANCELLED") return "CANCELLED ❌";
        return status || "";
    }

    function setMsg(text, type) {
        const msg = document.getElementById("msg");
        msg.className = type === "ok" ? "ok" : (type === "err" ? "err" : "");
        msg.textContent = text || "";
    }

    function toDateTimeLocalValue(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        const hours = String(date.getHours()).padStart(2, "0");
        const minutes = String(date.getMinutes()).padStart(2, "0");
        return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    function isWithinWorkingHours(dateTimeValue) {
        if (!dateTimeValue) return false;

        const selected = new Date(dateTimeValue);
        const hour = selected.getHours();
        const minute = selected.getMinutes();

        if (hour < 12) return false;
        if (hour > 21) return false;
        if (hour === 21 && minute > 0) return false;

        return true;
    }

    async function renderReservations() {
        const list = document.getElementById("list");
        list.textContent = "Загрузка...";

        const res = await loadMyReservations();

        if (res.status === 401) {
            location.href = "/login.html";
            return;
        }

        if (res.status !== 200) {
            const text = await res.text().catch(() => "");
            list.textContent = `Ошибка загрузки (HTTP ${res.status}) ${text}`;
            return;
        }

        const items = await res.json();

        if (!items.length) {
            list.textContent = "Брони пока нет.";
            return;
        }

        list.innerHTML = items.map(x => {
            const canCancel = x.status === "CONFIRMED";
            return `
        <div class="listItem ${canCancel ? "" : "danger"}">
          <div>
            <b>#${escapeHtml(x.reservationId)}</b>
            — столик <b>${escapeHtml(x.tableId)}</b>
            — <span class="pill">${escapeHtml(statusLabel(x.status))}</span>
          </div>
          <div class="muted">${escapeHtml(x.startTime)} — ${escapeHtml(x.endTime)}</div>
          <div class="muted">
            Имя: ${escapeHtml(x.guestName)} · Тел: ${escapeHtml(x.guestPhone)} · Персон: ${escapeHtml(x.persons)}
          </div>
          <div class="actions">
            ${canCancel ? `<button type="button" class="btnSmall" data-cancel-id="${escapeHtml(x.reservationId)}">Отменить</button>` : ""}
          </div>
        </div>
      `;
        }).join("");

        list.querySelectorAll("[data-cancel-id]").forEach(btn => {
            btn.addEventListener("click", async () => {
                const id = btn.getAttribute("data-cancel-id");
                if (!confirm(`Отменить бронь #${id}?`)) return;

                const resp = await cancelReservation(id);

                if (resp.status === 204 || resp.status === 200) {
                    setMsg(`Бронь #${id} отменена`, "ok");
                    await renderReservations();
                    return;
                }

                if (resp.status === 401) {
                    location.href = "/login.html";
                    return;
                }

                const text = await resp.text().catch(() => "");
                setMsg(`Ошибка отмены (HTTP ${resp.status}) ${text}`, "err");
            });
        });
    }

    window.addEventListener("DOMContentLoaded", async () => {
        const me = await getProfileOrNull();
        if (!me) {
            location.href = "/login.html";
            return;
        }

        document.getElementById("who").textContent = `Вы вошли как: ${me.login}`;

        const now = new Date();
        now.setSeconds(0, 0);
        document.getElementById("startTime").value = toDateTimeLocalValue(now);

        await renderReservations();

        document.getElementById("refreshBtn").addEventListener("click", renderReservations);

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await logoutRequest();
            location.href = "/login.html";
        });

        document.getElementById("resForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            setMsg("", "");

            const startTimeValue = document.getElementById("startTime").value;
            const persons = Number(document.getElementById("persons").value);

            if (persons <= 0) {
                setMsg("Количество гостей должно быть больше 0", "err");
                return;
            }

            if (persons > 8) {
                setMsg("Максимальное количество гостей — 8", "err");
                return;
            }

            if (!isWithinWorkingHours(startTimeValue)) {
                setMsg("Заведение работает с 12:00 до 24:00. Последнее доступное время начала брони — 21:00", "err");
                return;
            }

            const payload = {
                guestName: document.getElementById("guestName").value.trim(),
                guestPhone: document.getElementById("guestPhone").value.trim(),
                persons: persons,
                startTime: startTimeValue
            };

            const res = await createReservation(payload);

            if (res.status === 201 || res.status === 200) {
                const data = await res.json();
                setMsg(`Бронь создана ✅ #${data.reservationId}, столик ${data.tableId} (${data.startTime} — ${data.endTime})`, "ok");
                await renderReservations();
                return;
            }

            if (res.status === 401) {
                location.href = "/login.html";
                return;
            }

            if (res.status === 409) {
                const err = await res.json().catch(() => null);
                setMsg(err?.message || "Нет свободных столиков на выбранное время", "err");
                return;
            }

            if (res.status === 400) {
                const err = await res.json().catch(() => null);
                setMsg(err?.message || "Некорректные данные бронирования", "err");
                return;
            }

            const text = await res.text().catch(() => "");
            setMsg(`Ошибка бронирования (HTTP ${res.status}) ${text}`, "err");
        });
    });
</script>
</body>
</html>
